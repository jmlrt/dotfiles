# Vault path (required) - where articles are stored
vault: $HOME/Documents/PKM/Clippings

# Cache path (required) - must be absolute or will be resolved relative to vault
cache: $HOME/.cache/clipmd/cache.json

# =============================================================================
# TRIAGE - RSS sources and inbox handling
# =============================================================================
triage:
  rss_sources:
    - "https://korben.info/feedfull.xml"
    - "https://www.journaldugeek.com/feed/"
    - "https://simonwillison.net/atom/everything/"
    - "https://techcrunch.com/feed/"
    - "https://intelligence-artificielle.developpez.com/rss.php"
    - "https://claude.dev/rss.xml"
    - "https://code.claude.com/rss.xml"
    - "https://github.blog/feed/"
    - "https://www.seangoedecke.com/atom.xml"
    - "https://www.slate.fr/rss.xml"
    - "https://mistral.ai/rss.xml"
    - "https://www.elastic.co/blog/feed"
    - "https://www.runnea.fr/rss.xml"
    - "https://www.futura-sciences.com/rss/actualites.xml"
    - "https://feed.prismamediadigital.com/v1/geo/rss?limit=20"
  inbox_file: "INBOX.md"
  staging_folder: "0-To-Categorize"

# =============================================================================
# SPECIAL FOLDERS - Exclude from operations and statistics
# =============================================================================
special_folders:
  # Files to ignore in all commands (exclude_patterns left at defaults)
  ignore_files:
    - "README.md"
    - "AGENTS.md"
    - "INBOX.md"

# All other sections (version, domain_rules, frontmatter, dates, url_cleaning,
# filenames, folders, cache_config, fetch) are omitted: values matched clipmd
# defaults or are no longer used.
